# Example nginx server block for the chatbot API, reverse-proxying to the `server`
# container published at 127.0.0.1:4001 (see docker-compose.prod.yml's SERVER_HOST_PORT).
#
# Replace chatbot-api.maxpowereu.com with whatever subdomain/domain you point at this
# EC2 instance's public IP. Install with:
#   sudo cp deploy/nginx-chatbot.conf /etc/nginx/sites-available/chatbot-api
#   sudo ln -s /etc/nginx/sites-available/chatbot-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d chatbot-api.maxpowereu.com   # adds HTTPS + a second
#                                                          # server{} block for :443
#
# The widget is embedded on https://maxpowereu.com (a different origin), so this API
# MUST be served over HTTPS — browsers block a plain-HTTP fetch from an HTTPS page.

server {
    listen 80;
    listen [::]:80;
    server_name chatbot-api.maxpowereu.com;

    # Uncomment once certbot has issued a certificate (or let certbot add this for you):
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for POST /api/chat/stream (Server-Sent Events): without these,
        # nginx buffers the whole response and the widget never sees streamed tokens
        # until the connection closes.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }
}
