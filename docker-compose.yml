services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbot}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatbot} -d ${POSTGRES_DB:-chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chatbot}:${POSTGRES_PASSWORD:-chatbot}@postgres:5432/${POSTGRES_DB:-chatbot}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/server/src:/app/apps/server/src
      - ./apps/server/prisma:/app/apps/server/prisma
      - ./packages/shared/src:/app/packages/shared/src
      # Built via `pnpm --filter @mpe-chatbot/widget build` on the host; served at
      # GET /widget/mpe-chatbot-widget.js so one tunneled port covers API + widget.
      - ./apps/widget/dist:/app/apps/widget/dist:ro

  widget-dev:
    build:
      context: .
      dockerfile: apps/widget/Dockerfile
    restart: unless-stopped
    environment:
      VITE_CHATBOT_API_URL: ${VITE_CHATBOT_API_URL:-http://localhost:4000}
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./apps/widget/src:/app/apps/widget/src
      - ./apps/widget/demo.html:/app/apps/widget/demo.html
      - ./packages/shared/src:/app/packages/shared/src

volumes:
  pgdata:
